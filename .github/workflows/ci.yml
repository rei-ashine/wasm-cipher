# Checks and builds every pull request and push to main, and deploys
# main to GitHub Pages only after all checks pass
name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  # Allows a manual (re)deploy from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# On a PR, a new push cancels the previous run. On main every commit gets
# its own run, so a later merge never cancels or replaces an earlier
# commit's checks.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # Pinned so a new stable release cannot fail CI or change the deployed
  # build without a code change. Bump by hand and fix any new warnings.
  # Dependency versions are pinned by Cargo.lock (--locked).
  RUST_VERSION: "1.97.0"

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint (host)
        run: cargo clippy --locked --all-targets -- -D warnings
      # The deployed build targets wasm32, so check it compiles there too
      - name: Lint (wasm32)
        run: cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  # Builds the site. The artifact uploaded here is exactly what the deploy
  # job publishes, so PRs test the real deploy build.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WASM_PACK_VERSION: "0.15.0"
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      # wasm-pack is built from its crates.io source once per version and
      # toolchain, then restored from the cache instead of rebuilt each run
      - name: Cache wasm-pack
        id: wasm-pack-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ env.WASM_PACK_VERSION }}-rust-${{ env.RUST_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install wasm-pack
        if: steps.wasm-pack-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
      - name: Check wasm-pack
        run: wasm-pack --version
      - name: Build WASM
        run: wasm-pack build -- --locked
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 22.23.4 fixes the Brotli decoder flaw CVE-2026-111497. A plain
          # '22' could take an older patch release from the runner's cache.
          node-version: '^22.23.4'
      - name: Build Frontend
        working-directory: ./www
        run: |
          npm ci
          npm run build
      - name: Check build output
        run: test -f www/dist/index.html && find www/dist -name '*.wasm' | grep -q .
      # Unique per attempt so "Re-run all jobs" does not leave two artifacts
      # with the same name, which deploy-pages rejects. The deploy job reads
      # the name from this job's output, so re-running only the deploy job
      # still finds it.
      - name: Name artifact
        id: artifact
        run: echo "name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload only the built frontend directory
          path: './www/dist'
          name: ${{ steps.artifact.outputs.name }}

  deploy:
    needs: [rust, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The previous static.yml deploy's permissions, plus deployments: read
    # for the guard below
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    # One deployment at a time. Queue rather than cancel: cancelling a
    # running deploy because an older commit's run arrived later is how the
    # site could roll back.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The guard fails open: if checkout or the guard itself fails, the
      # deploy still runs, as it did before the guard existed
      - name: Checkout
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip if a newer commit is already deployed
        id: guard
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-guard.sh
      - name: Setup Pages
        if: steps.guard.outputs.deploy != 'false'
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        if: steps.guard.outputs.deploy != 'false'
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
